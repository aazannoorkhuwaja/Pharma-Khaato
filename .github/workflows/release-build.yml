name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, "pharmacy-pilot-*"]
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate tag/version consistency
        run: python -c "import os; from config import ApplicationSettings as A; tag=os.getenv('GITHUB_REF_NAME',''); assert not tag.startswith('v') or tag == 'v' + A.APP_VERSION, f'Tag {tag} does not match app version v{A.APP_VERSION}'"

      - name: Compile source
        run: python -m compileall -q main.py controllers core models ui scripts

      - name: UI source audit
        run: python scripts/ui_audit.py

      - name: Full test suite
        run: python -m pytest -q

      - name: Installed-runtime source self-check
        env:
          PHARMA_KHAATO_DATA_DIR: ${{ runner.temp }}/pharma-khaato-release-check
        run: python main.py --self-check --headless

      - name: Complete demo preflight
        run: python scripts/demo_mode.py --no-launch

      - name: Build native package and checksum
        run: python scripts/build_release.py

      - name: Smoke-test packaged executable
        run: python scripts/smoke_packaged.py

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Windows customer installer
        shell: powershell
        run: ./packaging/windows/build-installer.ps1 -UseExistingBuild

      - name: Verify Windows install, reinstall and data retention
        shell: powershell
        run: ./packaging/windows/smoke-installer.ps1

      - name: Keep installer failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-details
          path: |
            .release-smoke-data/functional-result.json
            .release-smoke-data/progress.jsonl
            .release-smoke-data/logs/app.log*
            build/pharma_khaato/warn-pharma_khaato.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Include the getting-started guide
        shell: powershell
        run: Copy-Item packaging/windows/START-HERE.html release/START-HERE.html

      - name: Downloadable Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-installer
          path: |
            release/*Setup-Windows-x64.exe
            release/*Setup-Windows-x64.exe.sha256
            release/START-HERE.html
          if-no-files-found: error
          retention-days: 30
