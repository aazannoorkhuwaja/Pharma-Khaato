# SQLite migrations are not Oracle PL/SQL. Quoted identifiers are valid SQLite;
# complete-table UPDATEs here intentionally backfill every historical ledger row.
# Keep migration bytes/checksums and all other scanner rules intact.
sonar.issue.ignore.multicriteria=sqliteQuoted,sqliteBackfill
sonar.issue.ignore.multicriteria.sqliteQuoted.ruleKey=plsql:QuotedIdentifiersCheck
sonar.issue.ignore.multicriteria.sqliteQuoted.resourceKey=migrations/*.sql
sonar.issue.ignore.multicriteria.sqliteBackfill.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.sqliteBackfill.resourceKey=migrations/*.sql
